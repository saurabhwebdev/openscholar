name: Feature Request
description: Suggest a new feature for OpenScholar
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature! Help us understand what you need.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions you've considered?
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this relate to?
      options:
        - Students
        - Staff / HR
        - Classes
        - Grades
        - Fees
        - Admissions
        - Library
        - Transport
        - Hostel
        - Timetable
        - Attendance
        - Welfare
        - Activities
        - Analytics
        - Portal
        - API
        - Authentication
        - Other
